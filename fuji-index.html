<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>富士山能见度指数 · 湘南</title>
<style>
:root{
  --bg1:#0a0f1e; --bg2:#1a2748; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --tx:#eef2fb; --mu:#9fb0d0; --acc:#ff9e5e;
  --g:#5fe3a1; --y:#d9e85f; --o:#ffc857; --r:#ff7a7a; --b:#8aa4d6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%,#2a2f55);color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans CJK SC",sans-serif;min-height:100%}
body{padding:max(12px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:17px;margin:0;letter-spacing:.02em}
select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 rgba(95,227,161,.7);animation:pulse 2s infinite}
.chip.err .dot{background:var(--r);animation:none}
.chip.flash{border-color:var(--acc);color:var(--acc)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(95,227,161,0)}100%{box-shadow:0 0 0 0 rgba(95,227,161,0)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:10px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--mu);font-weight:600;letter-spacing:.04em}
.hero{padding:0;overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0}
.num{background:rgba(0,0,0,.22);border-radius:14px;padding:8px 10px}
.num small{color:var(--mu);font-size:12px}
.num b{display:block;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.verdict{padding:8px 14px 14px}
.verdict .v1{font-size:19px;font-weight:700}
.verdict .v2{color:var(--mu);font-size:13px;margin-top:2px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.nav button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:15px}
.nav .t{font-weight:600;text-align:center;flex:1}
.nav .t small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.call{border-color:rgba(255,158,94,.5);background:rgba(255,158,94,.1)}
.call b{color:var(--acc)}
.win{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.win:first-of-type{border-top:0}
.win .k{font-size:12px;border-radius:8px;padding:1px 8px;white-space:nowrap;align-self:center}
.k.full{background:rgba(95,227,161,.18);color:var(--g)} .k.cap{background:rgba(255,200,87,.18);color:var(--o)}
.sub{color:var(--mu);font-size:12px}
.bands{display:grid;grid-template-columns:54px 1fr 34px;gap:4px 8px;align-items:center;font-size:12px;color:var(--mu)}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.log{font-size:12.5px;color:var(--mu);margin:0;padding:0;list-style:none}
.log li{padding:5px 0;border-top:1px solid var(--line)} .log li:first-child{border-top:0}
.log b{color:var(--tx)}
details summary{cursor:pointer;color:var(--mu);font-size:13px}
details p{font-size:12.5px;color:var(--mu);margin:8px 0 0}
.empty{padding:40px 10px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>🗻 富士山能见度 · 湘南</h1>
    <select id="view" aria-label="观测点"></select>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <span class="chip" id="live"><i class="dot"></i><span id="liveTx">正在取得数据…</span></span>
    <button id="reload" class="chip" style="cursor:pointer;color:var(--tx)">立即刷新</button>
  </div>
  <div id="main"><div class="card empty">正在抓取最新气象数据…</div></div>
</div>

<script>
// ==CORE==
const FUJI = {lat:35.36061, lon:138.72731, peak:3776};
const VIEWS = {
  yui:  {name:'由比ヶ浜（鎌倉）', lat:35.3066, lon:139.5480},
  ina:  {name:'稲村ヶ崎（鎌倉）', lat:35.3022, lon:139.5254},
  zushi:{name:'逗子海岸',         lat:35.2935, lon:139.5800},
  ensh: {name:'江ノ島',           lat:35.2994, lon:139.4815}
};
// 视线上的 5 个取样点（占观测点→富士山距离的比例），最后一个就是富士山本体
const TS = [0, 0.22, 0.45, 0.70, 1];
const PW = [0.7, 0.6, 0.6, 0.6, 1.6];           // 每个取样点的权重（富士山本体最重）
const LV = [1000,975,950,925,900,850,800,700,600,500];
// 可见的山体：丹沢・箱根会挡住约 2000m 以下，所以只看 2000–3776m
const EDGES = [3776,3500,3250,3000,2750,2500,2250,2000];
const BAND_H = EDGES.slice(0,-1).map((e,i)=> i===0 ? 3720 : (e+EDGES[i+1])/2);
const BAND_W = BAND_H.map(h=>1+(3776-h)/1200);   // 山体越往下越宽，面积权重越大
const CLEAR_T = 0.45;                            // 通透度 ≥45% 算“看得见”

function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function nn(v){return (typeof v==='number' && isFinite(v)) ? v : null;}

function pointsFor(view){
  return TS.map(t=>({lat:+(view.lat+(FUJI.lat-view.lat)*t).toFixed(4), lon:+(view.lon+(FUJI.lon-view.lon)*t).toFixed(4)}));
}
function hourlyVars(){
  const v=['relative_humidity_2m','cloud_cover_low','cloud_cover_mid','cloud_cover_high','precipitation'];
  for(const L of LV){ v.push('relative_humidity_'+L+'hPa','cloud_cover_'+L+'hPa','geopotential_height_'+L+'hPa'); }
  return v.join(',');
}
function buildUrl(view){
  const p=pointsFor(view);
  return 'https://api.open-meteo.com/v1/forecast?latitude='+p.map(x=>x.lat).join(',')
    +'&longitude='+p.map(x=>x.lon).join(',')
    +'&hourly='+hourlyVars()
    +'&models=jma_seamless&timezone=Asia%2FTokyo&past_hours=6&forecast_days=3';
}

// ---- 大气剖面：某点某小时，从地面到高空的 (高度, 湿度, 云量) ----
function profileAt(loc,j){
  const h=loc.hourly, elev=nn(loc.elevation)??0, pts=[];
  for(const L of LV){
    const z=nn(h['geopotential_height_'+L+'hPa']?.[j]);
    const rh=nn(h['relative_humidity_'+L+'hPa']?.[j]);
    const c=nn(h['cloud_cover_'+L+'hPa']?.[j]);
    if(z==null||rh==null||c==null) continue;
    if(z<elev+60) continue;                      // 在地面以下的气压层丢掉
    pts.push({z,rh,c});
  }
  if(pts.length<4) return fallbackProfile(loc,j);
  pts.sort((a,b)=>a.z-b.z);
  const rh2=nn(h.relative_humidity_2m?.[j]);
  pts.unshift({z:elev+10, rh: rh2??pts[0].rh, c:pts[0].c});
  return pts;
}
// 气压层数据缺失时，用低/中/高云量粗略代替
function fallbackProfile(loc,j){
  const h=loc.hourly, elev=nn(loc.elevation)??0;
  const lo=nn(h.cloud_cover_low?.[j])??0, mi=nn(h.cloud_cover_mid?.[j])??0, hi=nn(h.cloud_cover_high?.[j])??0;
  const rh2=nn(h.relative_humidity_2m?.[j])??60;
  const rhOf=c=>40+c*0.55;
  return [
    {z:elev+10, rh:rh2, c:lo*0.5},
    {z:1500,    rh:rhOf(lo), c:lo},
    {z:3000,    rh:rhOf(Math.max(lo,mi)), c:Math.max(lo*0.6,mi*0.5)},
    {z:5000,    rh:rhOf(mi), c:mi},
    {z:9000,    rh:rhOf(hi), c:hi*0.4}
  ];
}
function sampleP(pts,z){
  const n=pts.length;
  if(z<=pts[0].z) return pts[0];
  if(z>=pts[n-1].z) return pts[n-1];
  for(let k=1;k<n;k++){
    if(z<=pts[k].z){
      const a=pts[k-1], b=pts[k];
      let f=(z-a.z)/((b.z-a.z)||1);
      f = f<0.5 ? 2*f*f : 1-2*(1-f)*(1-f);        // 往更近的那层靠，少“抹平”薄云层
      return {rh:a.rh+(b.rh-a.rh)*f, c:a.c+(b.c-a.c)*f};
    }
  }
  return pts[n-1];
}
// 光线经过某点时的“遮挡量”：云 + 湿度霾 + 降水
function extParts(node,z,precip){
  const cloud = 3.0*Math.pow(clamp(node.c/100,0,1),1.8);
  const hw = z<1200 ? 1 : z<3000 ? 1-(z-1200)/1800 : 0;      // 霾主要在低层
  const haze = 0.5*Math.pow(clamp((node.rh-65)/30,0,1),2)*hw;
  const rain = precip>0.1 ? 0.8+0.4*Math.min(1,precip) : 0;
  return {cloud,haze,rain};
}
// 看向富士山 h 米高处，一路上的通透度
function bandEval(h,profs,precs,locs){
  let tc=0,pc=0,hz=0,rn=0;
  for(let i=0;i<TS.length;i++){
    const elev=nn(locs[i].elevation)??0;
    const z = i===TS.length-1 ? h : Math.max(TS[i]*h, elev+20);
    const node=sampleP(profs[i],z);
    const e=extParts(node,z,precs[i]);
    if(i===TS.length-1) tc+=PW[i]*e.cloud; else pc+=PW[i]*e.cloud;
    hz+=PW[i]*e.haze; rn+=PW[i]*e.rain;
  }
  return {T:Math.exp(-(tc+pc+hz+rn)), parts:{target:tc,path:pc,haze:hz,rain:rn}};
}
function labelOf(S,W){
  if(W>=80) return {k:'full', t:'整座都在！冲！', j:'全景クッキリ'};
  if(W>=60) return {k:'good', t:'基本全景，可以出发', j:'よく見える'};
  if(S>=50) return {k:'cap',  t:'只剩小顶，别白跑', j:'頭だけ'};
  if(S>=30||W>=30) return {k:'faint', t:'若隐若现，看运气', j:'うっすら'};
  return {k:'none', t:'富士山今天休息', j:'見えない'};
}
function whyText(parts){
  const tot=parts.target+parts.path+parts.haze+parts.rain;
  if(tot<0.35) return '空气通透，没有明显遮挡';
  const m=[['target','富士山体周围有云（笠云／吊し雲那类）'],['path','视线途中有云（相模湾～丹沢一带）'],['haze','低空湿度大，空气发霾'],['rain','有降水']];
  m.sort((a,b)=>parts[b[0]]-parts[a[0]]);
  return '主要遮挡：'+m[0][1];
}
// 一个小时的全部结果
function evalHour(locs,j){
  const profs=locs.map(l=>profileAt(l,j));
  const precs=locs.map(l=>nn(l.hourly.precipitation?.[j])??0);
  const bands=BAND_H.map(h=>bandEval(h,profs,precs,locs));
  const Ts=bands.map(b=>b.T);
  const S=(Ts[0]*2+Ts[1])/3;
  let sw=0,sT=0; Ts.forEach((t,i)=>{sw+=BAND_W[i];sT+=BAND_W[i]*t;});
  const W=sT/sw;
  const parts={target:0,path:0,haze:0,rain:0};
  bands.forEach((b,i)=>{for(const k in parts) parts[k]+=b.parts[k]*BAND_W[i]/sw;});
  // 从山顶往下，连续“看得见”的最低海拔
  let low=null;
  for(let i=0;i<Ts.length;i++){ if(Ts[i]>=CLEAR_T) low=EDGES[i+1]; else break; }
  const Si=Math.round(S*100), Wi=Math.round(W*100);
  return {S:Si,W:Wi,Ts:Ts.map(t=>Math.round(t*100)),low,parts,why:whyText(parts),verdict:labelOf(Si,Wi)};
}
function evalAll(data){
  const locs=Array.isArray(data)?data:[data];
  const time=locs[0].hourly.time;
  return time.map((tm,j)=>{
    const r=evalHour(locs,j);
    r.time=tm; r.ti=Date.parse(tm+':00Z'); r.hour=+tm.slice(11,13); r.date=tm.slice(0,10);
    return r;
  });
}
// ---- 日出日落（JST 分钟） ----
function sunMinutes(dateStr,lat,lon){
  const y=+dateStr.slice(0,4), m=+dateStr.slice(5,7), d=+dateStr.slice(8,10);
  const N=Math.round((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/864e5);
  const g=2*Math.PI/365*(N-1);
  const eot=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const la=lat*Math.PI/180;
  const ha=Math.acos(clamp(Math.cos(90.833*Math.PI/180)/(Math.cos(la)*Math.cos(decl))-Math.tan(la)*Math.tan(decl),-1,1))*180/Math.PI;
  return {rise:720-4*(lon+ha)-eot+540, set:720-4*(lon-ha)-eot+540};
}
function markDay(hours,view){
  const cache={};
  for(const h of hours){
    const s=cache[h.date]||(cache[h.date]=sunMinutes(h.date,view.lat,view.lon));
    h.sun=s; h.day = (h.hour*60+60>s.rise) && (h.hour*60<s.set);
  }
}
// ---- 时间窗口：什么时候全景、什么时候只剩头 ----
function findWindows(hours,fromIdx){
  const out=[]; let cur=null;
  const close=j=>{ if(cur){cur.end=j-1;cur.next=hours[j]||null;out.push(cur);cur=null;} };
  for(let j=fromIdx;j<hours.length;j++){
    const h=hours[j];
    const kind=!h.day?null:(h.W>=60?'full':(h.S>=50?'cap':null));
    if(cur&&kind===cur.kind){cur.peak=Math.max(cur.peak,kind==='full'?h.W:h.S); if(kind==='full'&&h.W>=cur.peakVal){cur.peakVal=h.W;cur.peakIdx=j;}}
    else{ close(j); if(kind){cur={kind,start:j,peak:kind==='full'?h.W:h.S,peakVal:h.W,peakIdx:j};} }
  }
  close(hours.length);
  return out;
}
// 新旧两版指数对比，找出数据是否变了
function diffHours(oldMap,newHours,nowTi){
  let maxd=0,at=null,was=null;
  for(const h of newHours){
    if(h.ti<nowTi) continue;
    const o=oldMap.get(h.time); if(!o) continue;
    const d=Math.max(Math.abs(h.S-o.S),Math.abs(h.W-o.W));
    if(d>maxd){maxd=d;at=h;was=o;}
  }
  return {changed:maxd>=1,maxd,at,was};
}
// ==END_CORE==

// ================= UI =================
const $=s=>document.querySelector(s);
const POLL_MS=5*60*1000;
const state={view:'yui',hours:[],sel:0,nowIdx:0,map:null,log:[],lastOk:null,nextAt:0,busy:false,retry:0};
try{const v=localStorage.getItem('fuji.view'); if(v&&VIEWS[v]) state.view=v;}catch(e){}

const colOf=v=>v>=70?'var(--g)':v>=50?'var(--y)':v>=30?'var(--o)':'var(--r)';
const pad=n=>String(n).padStart(2,'0');
const hm=h=>pad(h.hour)+':00';
function jstNow(){return Date.now()+9*3600e3;}
function dayLabel(h,nowDate){
  if(h.date===nowDate) return '今天';
  const d=Date.parse(nowDate+'T00:00:00Z');
  const diff=Math.round((Date.parse(h.date+'T00:00:00Z')-d)/864e5);
  return diff===1?'明天':diff===2?'后天':h.date.slice(5);
}
function nowDateStr(){return new Date(jstNow()).toISOString().slice(0,10);}

function mountainSvg(h){
  const top=38,bot=175,yOf=z=>top+(3776-z)/(3776-1500)*(bot-top);
  const path='M0 175 C 60 168, 105 95, 140 38 Q160 31 180 38 C 215 95, 260 168, 320 175 Z';
  let bands='';
  for(let i=0;i<EDGES.length-1;i++){
    const y1=yOf(EDGES[i]), y2=yOf(EDGES[i+1]), T=h.Ts[i]/100;
    const k=i/(EDGES.length-2);
    const r=Math.round(243-(243-111)*k), g=Math.round(246-(246-134)*k), b=Math.round(251-(251-184)*k);
    bands+=`<rect x="0" y="${y1}" width="320" height="${y2-y1+0.6}" fill="rgb(${r},${g},${b})" opacity="${(0.22+0.78*T).toFixed(2)}"/>`
          +`<rect x="0" y="${y1}" width="320" height="${y2-y1+0.6}" fill="#c9d3e6" opacity="${((1-T)*0.8).toFixed(2)}"/>`;
  }
  const yh=yOf(2000);
  return `<svg viewBox="0 0 320 190" role="img" aria-label="富士山可见部分示意">
  <defs><clipPath id="fc"><path d="${path}"/></clipPath>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16224a"/><stop offset=".7" stop-color="#40507e"/><stop offset="1" stop-color="#e9936a" stop-opacity=".55"/></linearGradient></defs>
  <rect width="320" height="190" fill="url(#sky)"/>
  <path d="${path}" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
  <g clip-path="url(#fc)">${bands}
    <rect x="0" y="${yh}" width="320" height="${bot-yh+1}" fill="#101a33" opacity=".9"/></g>
  <path d="M0 ${yh+10} Q40 ${yh+2} 80 ${yh+12} T160 ${yh+8} T240 ${yh+14} T320 ${yh+9} L320 190 L0 190 Z" fill="#0b1328"/>
  <text x="8" y="184" fill="#7f90b8" font-size="9">丹沢・箱根に隠れる（≈2000m以下）</text>
  ${h.low!=null&&h.Ts[0]>=45?`<text x="312" y="${yOf(h.low)-3}" text-anchor="end" fill="#fff" font-size="10">▲ ${h.low<=2000?'2000m以上すべて':h.low+'m 以上'}</text><line x1="190" x2="316" y1="${yOf(h.low)}" y2="${yOf(h.low)}" stroke="rgba(255,255,255,.55)" stroke-dasharray="3 3"/>`:''}
  </svg>`;
}

function chartSvg(){
  const hrs=state.hours; const i0=Math.max(0,state.nowIdx-3), i1=Math.min(hrs.length-1,i0+36);
  const n=Math.max(1,i1-i0), Wd=340,Ht=180,L=26,R=8,T=10,B=24;
  const x=k=>L+(Wd-L-R)*(k/n), y=v=>T+(Ht-T-B)*(1-v/100);
  let g='';
  for(let k=0;k<=n;k++){const h=hrs[i0+k]; if(!h.day){g+=`<rect x="${x(k)-(Wd-L-R)/n/2}" y="${T}" width="${(Wd-L-R)/n}" height="${Ht-T-B}" fill="#000" opacity=".28"/>`;}}
  [30,50,70].forEach(v=>{g+=`<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.15)" stroke-dasharray="2 4"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end" fill="#7f90b8" font-size="9">${v}</text>`;});
  const ptsW=[],ptsS=[];
  for(let k=0;k<=n;k++){const h=hrs[i0+k]; ptsW.push(`${x(k).toFixed(1)},${y(h.W).toFixed(1)}`); ptsS.push(`${x(k).toFixed(1)},${y(h.S).toFixed(1)}`);}
  g+=`<polygon points="${x(0)},${y(0)} ${ptsW.join(' ')} ${x(n)},${y(0)}" fill="rgba(95,227,161,.18)"/>`;
  g+=`<polyline points="${ptsW.join(' ')}" fill="none" stroke="#5fe3a1" stroke-width="2.2" stroke-linejoin="round"/>`;
  g+=`<polyline points="${ptsS.join(' ')}" fill="none" stroke="#ffc857" stroke-width="1.8" stroke-dasharray="5 3" stroke-linejoin="round"/>`;
  for(let k=0;k<=n;k++){const h=hrs[i0+k]; if(h.hour%6===0){g+=`<text x="${x(k)}" y="${Ht-8}" text-anchor="middle" fill="#9fb0d0" font-size="10">${pad(h.hour)}</text>`; if(h.hour===0)g+=`<line x1="${x(k)}" x2="${x(k)}" y1="${T}" y2="${Ht-B}" stroke="rgba(255,255,255,.25)"/>`;}}
  if(state.nowIdx>=i0&&state.nowIdx<=i1){const k=state.nowIdx-i0; g+=`<line x1="${x(k)}" x2="${x(k)}" y1="${T}" y2="${Ht-B}" stroke="#ff9e5e" stroke-width="1" stroke-dasharray="2 2"/><text x="${x(k)}" y="${T+9}" fill="#ff9e5e" font-size="9" text-anchor="middle">现在</text>`;}
  const sk=clamp(state.sel-i0,0,n), sh=hrs[i0+sk];
  g+=`<line x1="${x(sk)}" x2="${x(sk)}" y1="${T}" y2="${Ht-B}" stroke="#fff" stroke-width="1.5"/><circle cx="${x(sk)}" cy="${y(sh.W)}" r="4" fill="#5fe3a1" stroke="#fff"/><circle cx="${x(sk)}" cy="${y(sh.S)}" r="3.5" fill="#ffc857" stroke="#fff"/>`;
  return `<svg id="chart" viewBox="0 0 ${Wd} ${Ht}" style="width:100%;height:auto;touch-action:pan-y" data-i0="${i0}" data-n="${n}" data-l="${L}" data-w="${Wd}" data-r="${R}">${g}</svg>`;
}

function render(){
  if(!state.hours.length) return;
  const hrs=state.hours, h=hrs[state.sel], v=h.verdict, nd=nowDateStr();
  const isNow=state.sel===state.nowIdx;
  const wins=findWindows(hrs,state.nowIdx);
  const fullW=wins.find(w=>w.kind==='full'), capW=wins.find(w=>w.kind==='cap');
  let call='';
  if(fullW){
    const a=hrs[fullW.start], b=hrs[fullW.end], pk=hrs[fullW.peakIdx];
    const nx=fullW.next; const tail=nx?(nx.S>=50&&nx.W<60?`，<b>${hm(nx)} 起只剩头</b>`:nx.W<60?`，${hm(nx)} 起转差`:''):'';
    call=`<div class="card call"><b>想看全景：</b>${dayLabel(a,nd)} ${hm(a)}–${pad(b.hour+1)}:00（最佳 ${hm(pk)}，全体 ${pk.W}）${tail}。<div class="sub" style="margin-top:4px">得赶在这之前“到达”，不是“出发”。</div></div>`;
  }else if(capW){
    const a=hrs[capW.start], b=hrs[capW.end];
    call=`<div class="card call"><b>未来 36 小时没有全景窗口。</b>最好的是 ${dayLabel(a,nd)} ${hm(a)}–${pad(b.hour+1)}:00，只有山顶会露出来。</div>`;
  }else{
    call=`<div class="card call"><b>未来 36 小时白天基本看不到富士山。</b>下次数据更新后我会自动重算。</div>`;
  }
  const rows=wins.slice(0,5).map(w=>{
    const a=hrs[w.start], b=hrs[w.end], nx=w.next;
    const after=nx?` → ${hm(nx)} ${nx.verdict.j}`:'';
    return `<div class="win"><span>${dayLabel(a,nd)} ${hm(a)}–${pad(b.hour+1)}:00<div class="sub">峰值 ${w.peak}${after}</div></span><span class="k ${w.kind}">${w.kind==='full'?'全景':'只有头'}</span></div>`;
  }).join('')||'<div class="sub">暂无</div>';
  const bandsHtml=h.Ts.map((t,i)=>`<span>${EDGES[i]}m</span><span class="bar"><i style="width:${t}%;background:${colOf(t)}"></i></span><span style="text-align:right">${t}</span>`).join('');
  const logHtml=state.log.length?state.log.map(s=>`<li>${s}</li>`).join(''):'<li>还没有变化记录</li>';
  const night=!h.day?'（夜间，仅供参考）':'';
  $('#main').innerHTML=`
  <div class="card hero">${mountainSvg(h)}
    <div class="nums">
      <div class="num"><small>山顶 頭</small><b style="color:${colOf(h.S)}">${h.S}</b></div>
      <div class="num"><small>全体 全景</small><b style="color:${colOf(h.W)}">${h.W}</b></div>
    </div>
    <div class="verdict"><div class="v1">${v.t} <span class="sub">${v.j}</span></div>
      <div class="v2">${dayLabel(h,nd)} ${hm(h)}${isNow?'（现在）':''}${night} · ${h.why}</div></div>
  </div>
  <div class="nav"><button id="prev">◀</button>
    <div class="t">${dayLabel(h,nd)} ${hm(h)}<small>${isNow?'现在':'点图表或按钮换时间'}</small></div>
    <button id="next">▶</button>${isNow?'':'<button id="now">现在</button>'}</div>
  ${call}
  <div class="card"><h2>未来 36 小时　<span style="color:var(--g)">━ 全体</span>　<span style="color:var(--o)">╍ 山顶</span></h2>${chartSvg()}</div>
  <div class="card"><h2>窗口一览（白天）</h2>${rows}</div>
  <div class="card"><h2>山体各高度的通透度（%）</h2><div class="bands">${bandsHtml}</div>
    <div class="sub" style="margin-top:6px">≥45 算看得见。从山顶往下数，连续看得见的才算“露出来”的部分。</div></div>
  <div class="card"><h2>数据更新记录</h2><ul class="log">${logHtml}</ul></div>
  <div class="card"><details><summary>指数怎么算的</summary>
    <p>数据：气象厅 MSM／GSM 模型（经 Open-Meteo），沿「${VIEWS[state.view].name}→富士山」视线取 5 个点，逐层看云量和湿度。</p>
    <p><b>山顶</b>＝山顶约 400m 的通透度；<b>全体</b>＝2000–3776m 各高度通透度的面积加权平均。丹沢・箱根会挡住 2000m 以下，所以不计。</p>
    <p>早上全景、到了只剩头，通常是白天升温后低空湿度上升、视线途中和山腰生云。图表里能看到它是几点掉下来的。</p>
    <p>这是模型预报换算的指数，不是实测可视距离，当参考用，现场以肉眼为准。</p></details></div>`;
  document.title=`山${state.hours[state.nowIdx].S} 全${state.hours[state.nowIdx].W} · 富士山`;
  $('#prev').onclick=()=>{state.sel=Math.max(0,state.sel-1);render();};
  $('#next').onclick=()=>{state.sel=Math.min(hrs.length-1,state.sel+1);render();};
  const nb=$('#now'); if(nb) nb.onclick=()=>{state.sel=state.nowIdx;render();};
  const svg=$('#chart');
  svg.addEventListener('click',e=>{
    const r=svg.getBoundingClientRect(), W=+svg.dataset.w, L=+svg.dataset.l, R=+svg.dataset.r, n=+svg.dataset.n, i0=+svg.dataset.i0;
    const px=(e.clientX-r.left)/r.width*W;
    const k=Math.round(clamp((px-L)/(W-L-R),0,1)*n);
    state.sel=i0+k; render();
  });
}

function setChip(kind,text){
  const c=$('#live'); c.className='chip'+(kind?' '+kind:''); $('#liveTx').textContent=text;
}
function tickChip(){
  if(!state.lastOk) return;
  const ago=Math.round((Date.now()-state.lastOk)/60000);
  const left=Math.max(0,Math.round((state.nextAt-Date.now())/1000));
  const el=$('#live');
  if(el.classList.contains('err')||Date.now()<(state.flashUntil||0)) return;
  $('#liveTx').textContent=`LIVE · ${ago<1?'刚刚':ago+'分钟前'}取得 · ${Math.floor(left/60)}:${pad(left%60)} 后再查`;
}

async function refresh(manual){
  if(state.busy) return; state.busy=true;
  const view=VIEWS[state.view];
  try{
    if(manual) setChip('','正在抓取…');
    const r=await fetch(buildUrl(view),{cache:'no-store'});
    if(!r.ok){let m='';try{m=(await r.json()).reason||'';}catch(e){} throw new Error('HTTP '+r.status+' '+m);}
    const data=await r.json();
    const hours=evalAll(data); markDay(hours,view);
    const nowTi=jstNow(); let ni=0; hours.forEach((h,i)=>{if(h.ti<=nowTi) ni=i;});
    const first=!state.map;
    const old=state.map, oldNow=state.hours[state.nowIdx];
    const wasNow=state.sel===state.nowIdx||first;
    state.hours=hours; state.nowIdx=ni; if(wasNow) state.sel=ni; else state.sel=clamp(state.sel,0,hours.length-1);
    const cur=hours[ni];
    if(first){
      state.log.unshift(`<b>${pad(new Date(nowTi).getUTCHours())}:${pad(new Date(nowTi).getUTCMinutes())}</b> 首次取得 · 现在 山顶 ${cur.S} / 全体 ${cur.W}`);
    }else{
      const d=diffHours(old,hours,nowTi);
      if(d.changed){
        const t=new Date(nowTi);
        let s=`<b>${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}</b> 新数据 · 现在 山顶 ${oldNow?oldNow.S:'-'}→${cur.S} / 全体 ${oldNow?oldNow.W:'-'}→${cur.W}`;
        if(oldNow&&oldNow.verdict.k!==cur.verdict.k) s+=`，<b>变成「${cur.verdict.j}」</b>`;
        if(d.at&&d.at.ti!==cur.ti) s+=`；变化最大：${dayLabel(d.at,nowDateStr())} ${hm(d.at)} 全体 ${d.was.W}→${d.at.W}`;
        state.log.unshift(s); state.log=state.log.slice(0,15);
        state.flashUntil=Date.now()+5000; setChip('flash','新数据！指数已更新'); setTimeout(()=>{setChip('','LIVE');tickChip();},5000);
      }
    }
    state.map=new Map(hours.map(h=>[h.time,{S:h.S,W:h.W}]));
    state.lastOk=Date.now(); state.retry=0; state.nextAt=Date.now()+POLL_MS;
    if(Date.now()>=(state.flashUntil||0)) setChip('','LIVE');
    tickChip(); render();
  }catch(e){
    state.retry++;
    const wait=Math.min(60,15*state.retry);
    state.nextAt=Date.now()+wait*1000;
    setChip('err',`抓取失败（${String(e.message||e).slice(0,40)}），${wait}秒后重试`);
    if(!state.hours.length) $('#main').innerHTML=`<div class="card empty">没抓到数据。<br>这个页面需要联网访问 api.open-meteo.com，<br>请在能联网的浏览器里直接打开。</div>`;
  }finally{state.busy=false;}
}

// 观测点选择
const sel=$('#view');
sel.innerHTML=Object.entries(VIEWS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
sel.value=state.view;
sel.onchange=()=>{state.view=sel.value;try{localStorage.setItem('fuji.view',state.view);}catch(e){}
  state.map=null;state.hours=[];state.log=[];refresh(true);};
$('#reload').onclick=()=>refresh(true);
// 定时抓取 + 回到页面时立刻抓
setInterval(()=>{ if(Date.now()>=state.nextAt) refresh(false); },15000);
setInterval(tickChip,1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && Date.now()-(state.lastOk||0)>60000) refresh(false); });
refresh(false);
</script>
</body>
</html>
